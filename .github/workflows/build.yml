name: Build & Release

# - Push auf main: AppImage + .deb bauen.
#   Gibt es für die Version aus src-tauri/tauri.conf.json noch kein Release,
#   wird automatisch Tag v<Version> + GitHub-Release (Patchnotes aus CHANGELOG.md) erstellt.
#   -> Neue Version veröffentlichen = Version erhöhen, CHANGELOG ergänzen, pushen.
# - Tag v* oder manuell über den Actions-Tab: ebenfalls bauen (+ Release bei Tag).
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    # Ubuntu 22.04 = ältere glibc -> AppImage läuft auch auf SteamOS
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: System-Abhängigkeiten für Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev file

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Rust einrichten
        uses: dtolnay/rust-toolchain@stable

      - name: Rust-Build-Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Node-Pakete installieren
        run: npm install

      - name: AppImage und .deb bauen
        run: |
          set -o pipefail
          npx tauri build --bundles appimage deb 2>&1 | tee build.log

      - name: Fehlerprotokoll auf Branch ci-logs ablegen
        if: failure()
        run: |
          mkdir -p /tmp/ci-logs
          cp build.log /tmp/ci-logs/build.log 2>/dev/null || echo "kein build.log" > /tmp/ci-logs/build.log
          echo "${GITHUB_SHA} ${GITHUB_REF}" > /tmp/ci-logs/info.txt
          cd /tmp/ci-logs
          git init -q -b ci-logs
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "Build-Log ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" ci-logs

      - name: Dateien hochladen
        uses: actions/upload-artifact@v4
        with:
          name: LakuenLauncher-linux
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
          retention-days: 14
          if-no-files-found: error

      - name: Version und Release-Bedarf prüfen
        id: ver
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF}" == "refs/heads/main" ]] && ! git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Patchnotes aus CHANGELOG.md
        if: steps.ver.outputs.release == 'true'
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          awk -v v="[$VERSION]" '/^## /{p = index($0, v) > 0; if (p) next} p' CHANGELOG.md > release-notes.md
          [ -s release-notes.md ] || echo "LakuenLauncher v${VERSION}" > release-notes.md
          cat release-notes.md

      - name: GitHub-Release erstellen
        if: steps.ver.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: LakuenLauncher ${{ steps.ver.outputs.tag }}
          body_path: release-notes.md
          make_latest: true
          files: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
          fail_on_unmatched_files: true
