name: Release

# Ein neuer Tag wie v0.1.1 baut das AppImage und veröffentlicht es als GitHub-Release.
# Die Update-Prüfung im Launcher liest genau diese Releases.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: "--bundles appimage"
          # Windows ist vorbereitet und wird später aktiviert:
          # - platform: windows-latest
          #   args: "--bundles nsis"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux-Abhängigkeiten installieren
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Abhängigkeiten installieren
        run: npm install

      - name: Release-Notizen aus CHANGELOG.md lesen
        id: notes
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#v}"
          awk -v ver="$VER" '/^## /{p = index($0, "[" ver "]") > 0; next} p' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "Siehe CHANGELOG.md" > notes.md; fi
          {
            echo 'body<<EOF_NOTES'
            cat notes.md
            echo 'EOF_NOTES'
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "LakuenLauncher ${{ github.ref_name }}"
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
