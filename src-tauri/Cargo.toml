[package]
name = "lakuenlauncher"
version = "0.1.0"
description = "LakuenLauncher – lokaler Spiele- und App-Launcher für SteamOS/Linux"
authors = ["Dominic Lesina", "Claude"]
license = "MIT"
repository = "https://github.com/elkarbeenus/Lakuenlauncher"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
panic = "abort"
